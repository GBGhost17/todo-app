
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App - Quản lý công việc</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="logo">📝 Todo App</h1>
                <div class="user-section">
                    <span class="welcome-text">Xin chào, <span id="username">User</span></span>
                    <button id="logout-btn" class="btn-logout">Đăng xuất</button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Add Todo Form -->
            <div class="add-todo-section">
                <h2 class="section-title">Thêm công việc mới</h2>
                <form id="add-todo-form" class="todo-form">
                    <input 
                        type="text" 
                        id="todo-input" 
                        class="todo-input" 
                        placeholder="Nhập công việc cần làm..."
                        required
                    >
                    <button type="submit" class="btn btn-primary">
                        <span class="btn-icon">+</span>
                        Thêm
                    </button>
                </form>
            </div>

            <!-- Todo Stats -->
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-number" id="total-todos">0</div>
                    <div class="stat-label">Tổng số</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="active-todos">0</div>
                    <div class="stat-label">Đang làm</div>
                </div>
                <div class="stat-card stat-completed">
                    <div class="stat-number" id="completed-todos">0</div>
                    <div class="stat-label">Hoàn thành</div>
                </div>
            </div>

            <!-- Filter Buttons -->
            <div class="filter-section">
                <button class="filter-btn active" data-filter="all">Tất cả</button>
                <button class="filter-btn" data-filter="active">Đang làm</button>
                <button class="filter-btn" data-filter="completed">Hoàn thành</button>
            </div>

            <!-- Todo List -->
            <div class="todo-list-section">
                <div id="todo-list" class="todo-list">
                    <!-- Todos will be rendered here -->
                    <div class="empty-state">
                        <div class="empty-icon">📋</div>
                        <p>Chưa có công việc nào. Hãy thêm công việc đầu tiên!</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Check if user is logged in
        const token = localStorage.getItem('token');
        const username = localStorage.getItem('username');
        
        if (!token || !username) {
            window.location.href = '/login.html';
        } else {
            document.getElementById('username').textContent = username;
        }

        let todos = [];
        let currentFilter = 'all';

        // Logout
        document.getElementById('logout-btn').addEventListener('click', () => {
            if (confirm('Bạn có chắc muốn đăng xuất?')) {
                localStorage.removeItem('token');
                localStorage.removeItem('username');
                window.location.href = '/login.html';
            }
        });

        // Add todo
        document.getElementById('add-todo-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('todo-input');
            const task = input.value.trim();
            
            if (!task) return;

            try {
                const response = await fetch('/todos', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ task })
                });

                if (response.ok) {
                    input.value = '';
                    loadTodos();
                } else {
                    alert('Không thể thêm công việc');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Có lỗi xảy ra');
            }
        });

        // Load todos
        async function loadTodos() {
            try {
                const response = await fetch('/todos', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    todos = await response.json();
                    renderTodos();
                    updateStats();
                } else if (response.status === 401) {
                    localStorage.removeItem('token');
                    localStorage.removeItem('username');
                    window.location.href = '/login.html';
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        // Render todos
        function renderTodos() {
            const todoList = document.getElementById('todo-list');
            const filteredTodos = todos.filter(todo => {
                if (currentFilter === 'all') return true;
                if (currentFilter === 'active') return !todo.completed;
                if (currentFilter === 'completed') return todo.completed;
            });

            if (filteredTodos.length === 0) {
                todoList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📋</div>
                        <p>${currentFilter === 'all' ? 'Chưa có công việc nào' : 'Không có công việc nào'}</p>
                    </div>
                `;
                return;
            }

            todoList.innerHTML = filteredTodos.map(todo => `
                <div class="todo-item ${todo.completed ? 'completed' : ''}">
                    <input 
                        type="checkbox" 
                        class="todo-checkbox" 
                        ${todo.completed ? 'checked' : ''}
                        onchange="toggleTodo(${todo.id})"
                    >
                    <span class="todo-text">${escapeHtml(todo.task)}</span>
                    <button class="btn-delete" onclick="deleteTodo(${todo.id})">
                        🗑️
                    </button>
                </div>
            `).join('');
        }

        // Toggle todo
        window.toggleTodo = async (id) => {
            const todo = todos.find(t => t.id === id);
            if (!todo) return;

            try {
                const response = await fetch(`/todos/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ completed: !todo.completed })
                });

                if (response.ok) {
                    loadTodos();
                }
            } catch (error) {
                console.error('Error:', error);
            }
        };

        // Delete todo
        window.deleteTodo = async (id) => {
            if (!confirm('Bạn có chắc muốn xóa công việc này?')) return;

            try {
                const response = await fetch(`/todos/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    loadTodos();
                }
            } catch (error) {
                console.error('Error:', error);
            }
        };

        // Update stats
        function updateStats() {
            const total = todos.length;
            const completed = todos.filter(t => t.completed).length;
            const active = total - completed;

            document.getElementById('total-todos').textContent = total;
            document.getElementById('active-todos').textContent = active;
            document.getElementById('completed-todos').textContent = completed;
        }

        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderTodos();
            });
        });

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initial load
        loadTodos();
    </script>
</body>
</html>
