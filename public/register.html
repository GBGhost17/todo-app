
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Todo App</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1 class="auth-logo">📝 Todo App</h1>
                <h2 class="auth-title">Đăng ký tài khoản</h2>
                <p class="auth-subtitle">Tạo tài khoản để bắt đầu quản lý công việc</p>
            </div>

            <form id="register-form" class="auth-form">
                <div id="error-message" class="error-message" style="display: none;"></div>
                <div id="success-message" class="success-message" style="display: none;"></div>
                
                <div class="form-group">
                    <label for="username" class="form-label">Tên đăng nhập</label>
                    <input 
                        type="text" 
                        id="username" 
                        class="form-input" 
                        placeholder="Chọn tên đăng nhập"
                        required
                        minlength="3"
                        autocomplete="username"
                    >
                    <small class="form-hint">Tối thiểu 3 ký tự</small>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Mật khẩu</label>
                    <input 
                        type="password" 
                        id="password" 
                        class="form-input" 
                        placeholder="Tạo mật khẩu"
                        required
                        minlength="6"
                        autocomplete="new-password"
                    >
                    <small class="form-hint">Tối thiểu 6 ký tự</small>
                </div>

                <div class="form-group">
                    <label for="confirm-password" class="form-label">Xác nhận mật khẩu</label>
                    <input 
                        type="password" 
                        id="confirm-password" 
                        class="form-input" 
                        placeholder="Nhập lại mật khẩu"
                        required
                        autocomplete="new-password"
                    >
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="submit-btn">
                    Đăng ký
                </button>
            </form>

            <div class="auth-footer">
                <p>Đã có tài khoản? <a href="login.html" class="auth-link">Đăng nhập</a></p>
            </div>
        </div>
    </div>

    <script>
        // Check if already logged in
        if (localStorage.getItem('token')) {
            window.location.href = '/';
        }

        const registerForm = document.getElementById('register-form');
        const errorMessage = document.getElementById('error-message');
        const successMessage = document.getElementById('success-message');
        const submitBtn = document.getElementById('submit-btn');

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            // Validation
            if (!username || !password || !confirmPassword) {
                showError('Vui lòng điền đầy đủ thông tin');
                return;
            }

            if (username.length < 3) {
                showError('Tên đăng nhập phải có ít nhất 3 ký tự');
                return;
            }

            if (password.length < 6) {
                showError('Mật khẩu phải có ít nhất 6 ký tự');
                return;
            }

            if (password !== confirmPassword) {
                showError('Mật khẩu xác nhận không khớp');
                return;
            }

            // Disable button and show loading
            submitBtn.disabled = true;
            submitBtn.textContent = 'Đang đăng ký...';
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';

            try {
                const response = await fetch('/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    showSuccess('Đăng ký thành công! Đang chuyển đến trang đăng nhập...');
                    registerForm.reset();
                    
                    // Redirect to login after 2 seconds
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 2000);
                } else {
                    showError(data.message || 'Đăng ký thất bại');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Không thể kết nối đến server');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Đăng ký';
            }
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            successMessage.style.display = 'none';
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.style.display = 'block';
            errorMessage.style.display = 'none';
        }
    </script>
</body>
</html>
